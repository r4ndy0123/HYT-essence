<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HYT — Colección</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Tenor+Sans&display=swap" rel="stylesheet">
<link rel="stylesheet" href="menu.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --negro: #0a0a09;
  --blanco: #ffffff;
  --fondo: #f4f2ed;
  --gris: #8f8f8f;
  --serif: 'Cormorant Garamond', serif;
  --sans: 'Tenor Sans', sans-serif;
  --verde: #2c7a3f;
  --rojo: #c0392b;
}
body { background: linear-gradient(180deg,#f4f2ed 0%,#ece8e1 100%); padding:60px; font-family:var(--sans); color:var(--negro); min-height:100vh; }

/* HEADER */
.header { display:flex; justify-content:space-between; align-items:center; margin-bottom:60px; }
.logo { font-family:var(--serif); font-size:32px; letter-spacing:.35em; }
.header-right { display:flex; align-items:center; gap:16px; }
.volver { text-decoration:none; padding:14px 28px; border:1px solid rgba(0,0,0,.15); border-radius:50px; color:black; font-size:11px; letter-spacing:.2em; text-transform:uppercase; transition:.35s; }
.volver:hover { background:black; color:white; transform:translateY(-3px); }

/* CARRITO BTN */
.carrito-btn {
  position:relative; background:var(--negro); color:white;
  border:none; border-radius:50px; padding:14px 24px;
  font-family:var(--sans); font-size:11px; letter-spacing:.2em;
  text-transform:uppercase; cursor:pointer; transition:.3s;
  display:flex; align-items:center; gap:8px;
}
.carrito-btn:hover { opacity:.85; transform:translateY(-2px); }
.carrito-count {
  background:white; color:var(--negro);
  border-radius:50%; width:20px; height:20px;
  font-size:11px; font-weight:600;
  display:flex; align-items:center; justify-content:center;
  display:none;
}
.carrito-count.visible { display:flex; }

/* TITULO */
.titulo { text-align:center; margin-bottom:60px; }
.titulo span { font-size:11px; letter-spacing:.35em; text-transform:uppercase; color:var(--gris); display:block; margin-bottom:15px; }
.titulo h1 { font-family:var(--serif); font-size:72px; font-weight:300; letter-spacing:.05em; }



/* AUTH */
.auth-btn {
  padding:10px 18px; border-radius:50px;
  font-family:var(--sans); font-size:10px; letter-spacing:.15em;
  text-transform:uppercase; cursor:pointer; transition:.2s; text-decoration:none;
  border:1px solid rgba(0,0,0,.15); color:var(--negro); background:transparent;
}
.auth-btn:hover { background:var(--negro); color:white; }
.auth-user { font-size:11px; letter-spacing:.1em; color:var(--gris); }

/* SEARCH */
.search-wrap { margin-bottom: 30px; }
.search-input {
  width: 100%; max-width: 400px; padding: 12px 22px;
  border: 1px solid rgba(0,0,0,.12); border-radius: 50px;
  font-family: var(--sans); font-size: 12px; letter-spacing: .05em;
  background: white; outline: none; transition: .2s;
  color: var(--negro);
}
.search-input:focus { border-color: var(--negro); }
.search-input::placeholder { color: var(--gris); }

/* LOADING / ERROR */
.loading { text-align:center; padding:80px; font-size:13px; letter-spacing:.25em; text-transform:uppercase; color:var(--gris); }
.loading::after { content:''; display:inline-block; width:6px; height:6px; background:var(--gris); border-radius:50%; margin-left:10px; animation:pulse 1s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.2} }
.error { text-align:center; padding:60px; color:var(--rojo); font-size:14px; }

/* TABLA */
.catalogo-wrap { background:white; padding:30px; border-radius:25px; box-shadow:0 20px 60px rgba(0,0,0,.08); overflow:hidden; }
.catalogo { width:100%; border-collapse:separate; border-spacing:0 18px; }
.catalogo th { font-size:11px; letter-spacing:.25em; text-transform:uppercase; color:var(--gris); padding:20px; }
.catalogo td { background:white; padding:20px; text-align:center; font-size:14px; }
.catalogo tr { transition:.4s; }
.catalogo tbody tr:hover { transform:translateY(-6px); }
.catalogo img { width:130px; height:160px; object-fit:cover; border-radius:18px; box-shadow:0 12px 30px rgba(0,0,0,.12); transition:.35s; }
.catalogo tbody tr:hover img { transform:scale(1.05); }
.modelo { font-family:var(--serif); font-size:26px; }
.precio { font-size:18px; font-weight:600; }
.estado { display:inline-block; padding:10px 18px; border-radius:50px; background:#eef8ef; color:var(--verde); font-size:11px; letter-spacing:.2em; text-transform:uppercase; }
.estado.agotado { background:#fdf0f0; color:var(--rojo); }


/* DESCRIPCION */
.descripcion-cell { font-size: 12px; color: var(--gris); line-height: 1.6; max-width: 220px; text-align: left; }

/* STOCK BADGE */
.stock-badge {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
}
.stock-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--verde); }
.stock-dot.low { background: #e67e22; }
.stock-dot.out { background: var(--rojo); }

/* TALLA SELECTOR en tabla */
.talla-select {
  display:flex; gap:6px; flex-wrap:wrap; justify-content:center;
}
.talla-opt {
  padding:6px 12px; border:1px solid rgba(0,0,0,.15); border-radius:50px;
  font-size:11px; letter-spacing:.1em; cursor:pointer; transition:.2s;
  background:white; font-family:var(--sans);
}
.talla-opt:hover { border-color:var(--negro); }
.talla-opt.selected { background:var(--negro); color:white; border-color:var(--negro); }
.talla-opt.agotado-talla { opacity:.35; cursor:not-allowed; }

/* BTN AGREGAR */
.btn-agregar-carrito {
  padding:10px 20px; background:var(--negro); color:white;
  border:none; border-radius:50px; font-family:var(--sans);
  font-size:10px; letter-spacing:.15em; text-transform:uppercase;
  cursor:pointer; transition:.3s; white-space:nowrap;
}
.btn-agregar-carrito:hover { opacity:.8; transform:translateY(-2px); }
.btn-agregar-carrito:disabled { opacity:.35; cursor:not-allowed; transform:none; }

/* EMPTY */
.empty { text-align:center; padding:80px 40px; }
.empty p { font-family:var(--serif); font-size:28px; font-weight:300; color:var(--gris); margin-bottom:12px; }
.empty span { font-size:12px; letter-spacing:.2em; text-transform:uppercase; color:#bbb; }

/* ======= PANEL CARRITO ======= */
.carrito-overlay {
  position:fixed; inset:0; background:rgba(0,0,0,.4);
  z-index:500; opacity:0; pointer-events:none; transition:opacity .3s;
}
.carrito-overlay.open { opacity:1; pointer-events:all; }

.carrito-panel {
  position:fixed; top:0; right:0; bottom:0; width:420px; max-width:95vw;
  background:white; z-index:501; display:flex; flex-direction:column;
  transform:translateX(100%); transition:transform .35s cubic-bezier(.22,1,.36,1);
  box-shadow:-20px 0 60px rgba(0,0,0,.12);
}
.carrito-panel.open { transform:translateX(0); }

.carrito-header {
  padding:28px 28px 20px;
  border-bottom:1px solid rgba(0,0,0,.08);
  display:flex; justify-content:space-between; align-items:center;
}
.carrito-titulo { font-family:var(--serif); font-size:28px; font-weight:300; }
.carrito-cerrar { background:none; border:none; font-size:22px; cursor:pointer; color:var(--gris); padding:4px; }
.carrito-cerrar:hover { color:var(--negro); }

.carrito-items { flex:1; overflow-y:auto; padding:20px 28px; }
.carrito-vacio { text-align:center; padding:60px 20px; }
.carrito-vacio p { font-family:var(--serif); font-size:22px; font-weight:300; color:var(--gris); margin-bottom:8px; }
.carrito-vacio span { font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:#bbb; }

.carrito-item {
  display:flex; gap:16px; align-items:center;
  padding:16px 0; border-bottom:1px solid rgba(0,0,0,.06);
}
.carrito-item:last-child { border-bottom:none; }
.carrito-item img { width:72px; height:88px; object-fit:cover; border-radius:10px; flex-shrink:0; }
.carrito-item-info { flex:1; }
.carrito-item-nombre { font-family:var(--serif); font-size:18px; margin-bottom:4px; }
.carrito-item-talla { font-size:11px; letter-spacing:.15em; text-transform:uppercase; color:var(--gris); margin-bottom:6px; }
.carrito-item-precio { font-size:14px; font-weight:600; }
.carrito-item-actions { display:flex; align-items:center; gap:8px; margin-top:8px; }
.qty-btn { width:26px; height:26px; border:1px solid rgba(0,0,0,.15); border-radius:50%; background:white; cursor:pointer; font-size:14px; display:flex; align-items:center; justify-content:center; transition:.2s; }
.qty-btn:hover { background:var(--negro); color:white; border-color:var(--negro); }
.qty-num { font-size:14px; min-width:20px; text-align:center; }
.btn-eliminar { background:none; border:none; color:var(--gris); cursor:pointer; font-size:12px; letter-spacing:.1em; text-transform:uppercase; margin-left:8px; transition:.2s; }
.btn-eliminar:hover { color:var(--rojo); }

.carrito-footer {
  padding:20px 28px 28px;
  border-top:1px solid rgba(0,0,0,.08);
}
.carrito-total-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
.carrito-total-label { font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--gris); }
.carrito-total-num { font-family:var(--serif); font-size:28px; font-weight:300; }

.btn-whatsapp {
  width:100%; padding:18px; background:#25D366; color:white;
  border:none; border-radius:50px; font-family:var(--sans);
  font-size:12px; letter-spacing:.2em; text-transform:uppercase;
  cursor:pointer; transition:.3s; display:flex; align-items:center; justify-content:center; gap:10px;
}
.btn-whatsapp:hover { background:#1fb855; transform:translateY(-2px); }
.btn-vaciar { width:100%; margin-top:10px; padding:12px; background:transparent; color:var(--gris); border:1px solid rgba(0,0,0,.12); border-radius:50px; font-family:var(--sans); font-size:10px; letter-spacing:.2em; text-transform:uppercase; cursor:pointer; transition:.2s; }
.btn-vaciar:hover { border-color:var(--rojo); color:var(--rojo); }

/* TOAST */
.toast { position:fixed; bottom:30px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--negro); color:white; padding:14px 28px; border-radius:50px; font-size:12px; letter-spacing:.15em; text-transform:uppercase; opacity:0; transition:.3s; z-index:600; white-space:nowrap; }
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

@media(max-width:768px) {
  body { padding: 16px; }
  .header { flex-direction: column; gap: 14px; align-items: flex-start; }
  .header-right { width: 100%; justify-content: space-between; }
  .logo { font-size: 22px; }
  .volver { padding: 10px 18px; font-size: 10px; }
  .carrito-btn { padding: 10px 18px; font-size: 10px; }
  .titulo h1 { font-size: 38px; }
  .titulo { margin-bottom: 24px; }
  .search-wrap { margin-bottom: 20px; }
  .search-input { padding: 12px 20px; font-size: 12px; }

  /* TABLA → CARDS */
  .catalogo-wrap { padding: 0; background: transparent; box-shadow: none; border-radius: 0; }
  .catalogo thead { display: none; }
  .catalogo { border-spacing: 0; }
  .catalogo tbody { display: flex; flex-direction: column; gap: 14px; }
  .catalogo tr {
    display: grid;
    grid-template-columns: 120px 1fr;
    grid-template-rows: auto auto auto auto auto;
    column-gap: 16px;
    row-gap: 8px;
    background: white;
    border-radius: 20px;
    padding: 16px;
    box-shadow: 0 2px 16px rgba(0,0,0,.07);
    transform: none !important;
  }
  .catalogo tr td:nth-child(1) { grid-column:1; grid-row:1/6; padding:0; background:transparent; }
  .catalogo img { width:120px; height:148px; border-radius:14px; object-fit:cover; box-shadow:0 6px 20px rgba(0,0,0,.13); transform:none !important; }
  .catalogo tr td:nth-child(2) { grid-column:2; grid-row:1; padding:0; background:transparent; text-align:left; }
  .modelo { font-size: 20px; line-height: 1.1; }
  .descripcion-cell { font-size: 11px; margin-top: 4px; max-width: 100%; }
  .catalogo tr td:nth-child(3) { grid-column:2; grid-row:2; padding:0; background:transparent; text-align:left; }
  .talla-select { justify-content:flex-start; gap:5px; }
  .talla-opt { padding:5px 10px; font-size:10px; }
  .catalogo tr td:nth-child(4) { grid-column:2; grid-row:3; padding:0; background:transparent; text-align:left; }
  .precio { font-size:15px; }
  .catalogo tr td:nth-child(5) { grid-column:2; grid-row:4; padding:0; background:transparent; text-align:left; }
  .estado { padding:5px 12px; font-size:10px; }
  .stock-badge { font-size:10px; margin-top:4px; }
  .catalogo tr td:nth-child(6) { grid-column:1/3; grid-row:6; padding:0; background:transparent; margin-top:4px; }
  .btn-agregar-carrito { width:100%; padding:13px; font-size:10px; border-radius:50px; }

  /* CARRITO */
  .carrito-panel { width:100%; }
  .carrito-header { padding:20px; }
  .carrito-items { padding:16px 20px; }
  .carrito-footer { padding:16px 20px 24px; }
}
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="logo">HYT ESSENCE</div>
  <div class="header-right">
    <a href="index.html" class="volver">← Volver</a>
    <button class="carrito-btn" onclick="abrirCarrito()">
      🛒 Carrito
      <span class="carrito-count" id="carrito-count">0</span>
    </button>
  </div>
</div>

<div class="titulo">
  <span>Colección oficial</span>
  <h1>Catálogo HYT</h1>
</div>

<div class="search-wrap">
  <input type="text" class="search-input" id="search-input" placeholder="Buscar prenda..." oninput="filtrarProductos(this.value)">
</div>
<div id="contenido">
  <div class="loading">Cargando productos</div>
</div>

<!-- PANEL CARRITO -->
<div class="carrito-overlay" id="carrito-overlay" onclick="cerrarCarrito()"></div>
<div class="carrito-panel" id="carrito-panel">
  <div class="carrito-header">
    <span class="carrito-titulo">Tu carrito</span>
    <button class="carrito-cerrar" onclick="cerrarCarrito()">✕</button>
  </div>
  <div class="carrito-items" id="carrito-items"></div>
  <div class="carrito-footer" id="carrito-footer" style="display:none">
    <div class="carrito-total-row">
      <span class="carrito-total-label">Total</span>
      <span class="carrito-total-num" id="carrito-total">$0 MXN</span>
    </div>
    <button class="btn-whatsapp" onclick="pedirWhatsApp()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
      Pedir por WhatsApp
    </button>
    <button class="btn-vaciar" onclick="vaciarCarrito()">Vaciar carrito</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = 'https://ufzijqylddyaswijqtkp.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVmemlqcXlsZGR5YXN3aWpxdGtwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2NTg0ODEsImV4cCI6MjA5NTIzNDQ4MX0.lIogAVoQ6lrV6bHTuI3qqiqBSV8khXI6PLBTIGNlfk4';
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);


// AUTH
async function initColAuth() {
  const { data: { session } } = await db.auth.getSession();
  const el = document.getElementById('col-auth');
  if (session) {
    const nombre = session.user.user_metadata?.nombre || session.user.email.split('@')[0];
    el.innerHTML = `<span class="auth-user">${nombre}</span>`;
  } else {
    el.innerHTML = `<a href="login.html" class="auth-btn">Mi cuenta</a>`;
  }
}
initColAuth();

const WA_NUMBER = '5217821317909';

// ===== CARRITO =====
let carrito = JSON.parse(localStorage.getItem('hyt_carrito') || '[]');

function guardarCarrito() {
  localStorage.setItem('hyt_carrito', JSON.stringify(carrito));
  actualizarContador();
}

function actualizarContador() {
  const total = carrito.reduce((s, i) => s + i.cantidad, 0);
  const el = document.getElementById('carrito-count');
  el.textContent = total;
  el.classList.toggle('visible', total > 0);
}

function agregarAlCarrito(id, nombre, precio, talla, imagen) {
  if (!talla) { mostrarToast('Selecciona una talla'); return; }
  const key = `${id}_${talla}`;
  const existing = carrito.find(i => i.key === key);
  if (existing) {
    existing.cantidad++;
  } else {
    carrito.push({ key, id, nombre, precio, talla, imagen, cantidad: 1 });
  }
  guardarCarrito();
  renderCarrito();
  mostrarToast(`${nombre} (${talla}) agregado`);
}

async function cambiarCantidad(key, delta) {
  const item = carrito.find(i => i.key === key);
  if (!item) return;

  if (delta > 0) {
    // Verificar stock real antes de aumentar
    const { data: prod } = await db.from('productos').select('stock').eq('id', item.id).single();
    const stockReal = prod ? (prod.stock || 0) : 0;
    const totalEnCarrito = carrito.filter(i => i.id == item.id).reduce((s,i) => s + i.cantidad, 0);
    if (totalEnCarrito >= stockReal) {
      mostrarToast(`Solo hay ${stockReal} en stock`);
      return;
    }
  }

  item.cantidad += delta;
  if (item.cantidad <= 0) carrito = carrito.filter(i => i.key !== key);
  guardarCarrito();
  renderCarrito();
}

function eliminarItem(key) {
  carrito = carrito.filter(i => i.key !== key);
  guardarCarrito();
  renderCarrito();
}

function vaciarCarrito() {
  carrito = [];
  guardarCarrito();
  renderCarrito();
}

function renderCarrito() {
  const container = document.getElementById('carrito-items');
  const footer = document.getElementById('carrito-footer');

  if (carrito.length === 0) {
    container.innerHTML = `
      <div class="carrito-vacio">
        <p>Tu carrito está vacío</p>
        <span>Agrega productos para comenzar</span>
      </div>`;
    footer.style.display = 'none';
    return;
  }

  const total = carrito.reduce((s, i) => s + i.precio * i.cantidad, 0);
  container.innerHTML = carrito.map(item => `
    <div class="carrito-item">
      <img src="${item.imagen}" alt="${item.nombre}">
      <div class="carrito-item-info">
        <div class="carrito-item-nombre">${item.nombre}</div>
        <div class="carrito-item-talla">Talla: ${item.talla}</div>
        <div class="carrito-item-precio">$${(item.precio * item.cantidad).toFixed(0)} MXN</div>
        <div class="carrito-item-actions">
          <button class="qty-btn" onclick="cambiarCantidad('${item.key}', -1)">−</button>
          <span class="qty-num">${item.cantidad}</span>
          <button class="qty-btn" onclick="cambiarCantidad('${item.key}', 1)">+</button>
          <button class="btn-eliminar" onclick="eliminarItem('${item.key}')">Quitar</button>
        </div>
      </div>
    </div>`).join('');

  document.getElementById('carrito-total').textContent = `$${total.toFixed(0)} MXN`;
  footer.style.display = 'block';
}

function abrirCarrito() {
  renderCarrito();
  document.getElementById('carrito-overlay').classList.add('open');
  document.getElementById('carrito-panel').classList.add('open');
}

function cerrarCarrito() {
  document.getElementById('carrito-overlay').classList.remove('open');
  document.getElementById('carrito-panel').classList.remove('open');
}

async function pedirWhatsApp() {
  if (carrito.length === 0) return;

  // Verificar sesión — redirigir a login si no hay
  const { data: { session } } = await db.auth.getSession();
  if (!session) {
    // Guardar carrito antes de redirigir
    localStorage.setItem('hyt_carrito', JSON.stringify(carrito));
    cerrarCarrito();
    mostrarToast('Inicia sesión para continuar');
    setTimeout(() => {
      window.location.href = 'login.html?redirect=coleccion.html';
    }, 1200);
    return;
  }

  const nombre = session.user.user_metadata?.nombre || session.user.email.split('@')[0];
  const total = carrito.reduce((s, i) => s + i.precio * i.cantidad, 0);
  const lineas = carrito.map(i =>
    `• ${i.nombre} (Talla ${i.talla}) x${i.cantidad} — $${(i.precio * i.cantidad).toFixed(0)} MXN`
  ).join('\n');
  const mensaje = `Hola, soy *${nombre}* y me interesan los siguientes productos de HYT ESSENCE:\n\n${lineas}\n\n*Total: $${total.toFixed(0)} MXN*\n\n¿Me pueden ayudar con el pedido?`;
  window.open(`https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(mensaje)}`, '_blank');

  // Guardar pedido en Supabase
  await db.from('pedidos').insert({
    usuario_id: session.user.id,
    items: carrito.map(i => ({ nombre: i.nombre, talla: i.talla, cantidad: i.cantidad, precio: i.precio })),
    total
  });

  // Descontar stock en Supabase
  for (const item of carrito) {
    const prod = todosProductos.find(p => p.id == item.id);
    if (prod) {
      const nuevoStock = Math.max(0, (prod.stock || 0) - item.cantidad);
      await db.from('productos').update({ stock: nuevoStock }).eq('id', item.id);
    }
  }
  vaciarCarrito();
  cerrarCarrito();
  await cargarProductos();
}

function mostrarToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ===== PRODUCTOS =====

let todosProductos = [];

function filtrarProductos(q) {
  const lower = q.toLowerCase().trim();
  const filtrados = lower ? todosProductos.filter(p =>
    p.nombre.toLowerCase().includes(lower) ||
    (p.descripcion || '').toLowerCase().includes(lower)
  ) : todosProductos;
  renderProductos(filtrados);
}

function renderProductos(productos) {
  const contenido = document.getElementById('contenido');
  if (!productos || productos.length === 0) {
    contenido.innerHTML = '<div class="catalogo-wrap"><div class="empty"><p>Sin resultados</p><span>Intenta con otro nombre</span></div></div>';
    return;
  }
  const filas = productos.map(p => {
    const tallas = (p.tallas || 'S · M · L · XL').split(' · ');
    const tallasHTML = tallas.map(t =>
      `<button class="talla-opt" onclick="seleccionarTalla(this, '${p.id}')" data-talla="${t}">${t}</button>`
    ).join('');
    const stock = p.stock || 0;
    const stockDot = stock === 0 ? 'out' : stock <= 3 ? 'low' : '';
    const stockTexto = stock === 0 ? 'Sin stock' : stock <= 3 ? `Últimas ${stock}` : `${stock} disponibles`;
    const agotado = !p.disponible || stock === 0;
    return `<tr>
      <td><img src="${p.imagen_url}" alt="${p.nombre}" onerror="this.src=''"></td>
      <td>
        <div class="modelo">${p.nombre}</div>
        ${p.descripcion ? `<div class="descripcion-cell">${p.descripcion}</div>` : ''}
      </td>
      <td><div class="talla-select" id="tallas-${p.id}">${tallasHTML}</div></td>
      <td class="precio">$${Number(p.precio).toFixed(0)} MXN</td>
      <td>
        <span class="estado ${agotado ? 'agotado' : ''}">${agotado ? 'Agotado' : 'Disponible'}</span>
        <div class="stock-badge" style="margin-top:6px">
          <span class="stock-dot ${stockDot}"></span>
          <span>${stockTexto}</span>
        </div>
      </td>
      <td>${!agotado
        ? `<button class="btn-agregar-carrito" onclick="agregarDesdeTabla('${p.id}', '${p.nombre}', ${p.precio}, '${p.imagen_url}')">+ Agregar</button>`
        : `<button class="btn-agregar-carrito" disabled>Agotado</button>`
      }</td>
    </tr>`;
  }).join('');
  contenido.innerHTML = `
    <div class="catalogo-wrap">
      <table class="catalogo">
        <thead><tr>
          <th>Imagen</th><th>Modelo</th><th>Talla</th>
          <th>Precio</th><th>Estado</th><th>Agregar</th>
        </tr></thead>
        <tbody>${filas}</tbody>
      </table>
    </div>`;
}

async function cargarProductos() {
  const contenido = document.getElementById('contenido');
  const { data: productos, error } = await db
    .from('productos').select('*').order('created_at', { ascending: true });

  if (error) {
    contenido.innerHTML = `<div class="error">Error: ${error.message}</div>`;
    return;
  }
  if (!productos || productos.length === 0) {
    contenido.innerHTML = '<div class="catalogo-wrap"><div class="empty"><p>No hay productos aún</p></div></div>';
    return;
  }
  todosProductos = productos;
  renderProductos(productos);
}

function seleccionarTalla(btn, prodId) {
  document.querySelectorAll(`#tallas-${prodId} .talla-opt`).forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
}

async function agregarDesdeTabla(id, nombre, precio, imagen) {
  const selected = document.querySelector(`#tallas-${id} .talla-opt.selected`);
  const talla = selected ? selected.dataset.talla : null;
  if (!talla) { mostrarToast('Selecciona una talla'); return; }

  // Verificar stock en tiempo real desde Supabase
  const { data: prod } = await db.from('productos').select('stock').eq('id', id).single();
  const stockReal = prod ? (prod.stock || 0) : 0;
  const enCarrito = carrito.filter(i => i.id == id).reduce((s,i) => s + i.cantidad, 0);
  if (enCarrito >= stockReal) {
    mostrarToast('No hay más stock disponible');
    return;
  }

  agregarAlCarrito(id, nombre, precio, talla, imagen);
  if (selected) selected.classList.remove('selected');
}

cargarProductos();
actualizarContador();
</script>
