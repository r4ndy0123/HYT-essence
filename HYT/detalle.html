<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HYT — Producto</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=Tenor+Sans&display=swap" rel="stylesheet">
<link rel="stylesheet" href="menu.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--negro:#0a0a09;--fondo:#f4f2ed;--gris:#8f8f8f;--serif:'Cormorant Garamond',serif;--sans:'Tenor Sans',sans-serif;--verde:#2c7a3f;--rojo:#c0392b;}
html{scroll-behavior:smooth;}
body{background:var(--fondo);min-height:100vh;font-family:var(--sans);color:var(--negro);}

/* NAV */
.nav{position:fixed;top:0;left:0;right:0;z-index:200;display:flex;align-items:center;justify-content:space-between;padding:20px 52px;background:rgba(244,242,237,.95);backdrop-filter:blur(10px);border-bottom:1px solid rgba(0,0,0,.06);}
.nav-logo{font-family:var(--serif);font-size:20px;letter-spacing:.35em;color:var(--negro);text-decoration:none;}
.nav-right{display:flex;align-items:center;gap:16px;}
.nav-back{text-decoration:none;padding:10px 20px;border:1px solid rgba(0,0,0,.15);border-radius:50px;color:var(--negro);font-size:10px;letter-spacing:.2em;text-transform:uppercase;transition:.3s;}
.nav-back:hover{background:var(--negro);color:white;}

/* LAYOUT */
.detalle-wrap{max-width:1100px;margin:0 auto;padding:100px 52px 80px;display:grid;grid-template-columns:1fr 1fr;gap:80px;align-items:start;}

/* IMAGE */
.detalle-img-wrap{position:sticky;top:90px;}
.detalle-img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:24px;box-shadow:0 24px 80px rgba(0,0,0,.12);}

/* INFO */
.detalle-categoria{font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--gris);margin-bottom:14px;}
.detalle-nombre{font-family:var(--serif);font-size:clamp(36px,4.5vw,62px);font-weight:300;line-height:1;margin-bottom:18px;}
.detalle-precio{font-family:var(--serif);font-size:30px;font-weight:300;margin-bottom:8px;}
.detalle-stock{display:flex;align-items:center;gap:8px;margin-bottom:28px;}
.stock-dot{width:7px;height:7px;border-radius:50%;background:var(--verde);}
.stock-dot.low{background:#e67e22;}
.stock-dot.out{background:var(--rojo);}
.stock-txt{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--gris);}
.detalle-divider{height:1px;background:rgba(0,0,0,.08);margin-bottom:28px;}
.detalle-descripcion{font-size:15px;line-height:1.9;color:rgba(10,10,9,.65);margin-bottom:36px;}

/* TALLAS */
.talla-label{font-size:10px;letter-spacing:.25em;text-transform:uppercase;color:var(--gris);margin-bottom:12px;}
.talla-grid{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:28px;}
.talla-btn{padding:12px 20px;border:1px solid rgba(0,0,0,.15);border-radius:50px;font-family:var(--sans);font-size:12px;letter-spacing:.1em;cursor:pointer;transition:.2s;background:white;}
.talla-btn:hover{border-color:var(--negro);}
.talla-btn.sel{background:var(--negro);color:white;border-color:var(--negro);}

/* BTNS */
.btn-agregar{width:100%;padding:17px;background:var(--negro);color:white;border:none;border-radius:50px;font-family:var(--sans);font-size:12px;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;transition:.3s;margin-bottom:10px;}
.btn-agregar:hover{opacity:.85;transform:translateY(-2px);}
.btn-agregar:disabled{opacity:.35;cursor:not-allowed;transform:none;}
.btn-wa{width:100%;padding:15px;background:transparent;color:var(--negro);border:1px solid rgba(0,0,0,.2);border-radius:50px;font-family:var(--sans);font-size:12px;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;transition:.3s;display:flex;align-items:center;justify-content:center;gap:8px;}
.btn-wa:hover{background:#25D366;color:white;border-color:#25D366;}

/* TOAST */
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--negro);color:white;padding:14px 28px;border-radius:50px;font-size:12px;letter-spacing:.15em;text-transform:uppercase;opacity:0;transition:.3s;z-index:600;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

.loading-wrap{display:flex;align-items:center;justify-content:center;min-height:80vh;}
.loading-txt{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--gris);}

/* RESPONSIVE */
@media(max-width:768px){
  .nav{padding:16px 20px;}
  .detalle-wrap{grid-template-columns:1fr;gap:28px;padding:80px 20px 60px;}
  .detalle-img-wrap{position:static;}
  .detalle-img{aspect-ratio:3/4;border-radius:16px;}
  .detalle-nombre{font-size:36px;}
  .detalle-precio{font-size:26px;}
  .btn-agregar,.btn-wa{padding:14px;}
}
@media(min-width:769px) and (max-width:1024px){
  .detalle-wrap{padding:90px 36px 60px;gap:48px;}
}
</style>
</head>
<body>

<nav class="nav">
  <a href="index.html" class="nav-logo">HYT ESSENCE</a>
  <div class="nav-right">
    <a href="coleccion.html" class="nav-back">← Colección</a>
    <div class="hamburger dark" onclick="abrirMenu()"><span></span><span></span><span></span></div>
  </div>
</nav>

<div id="detalle-contenido">
  <div class="loading-wrap"><span class="loading-txt">Cargando...</span></div>
</div>

<div class="toast" id="toast"></div>
<div id="hyt-menu-root"></div>
<script src="menu.js" defer></script>

<script>
const SUPABASE_URL = 'https://ufzijqylddyaswijqtkp.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVmemlqcXlsZGR5YXN3aWpxdGtwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2NTg0ODEsImV4cCI6MjA5NTIzNDQ4MX0.lIogAVoQ6lrV6bHTuI3qqiqBSV8khXI6PLBTIGNlfk4';
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);
const WA = '5217821317909';

let carrito = JSON.parse(localStorage.getItem('hyt_carrito') || '[]');
function guardarCarrito() { localStorage.setItem('hyt_carrito', JSON.stringify(carrito)); }

let tallaSeleccionada = null;

function seleccionarTalla(btn, talla) {
  document.querySelectorAll('.talla-btn').forEach(b => b.classList.remove('sel'));
  btn.classList.add('sel');
  tallaSeleccionada = talla;
}

function mostrarToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

async function agregarAlCarritoDetalle(id, nombre, precio, imagen) {
  if (!tallaSeleccionada) { mostrarToast('Selecciona una talla'); return; }
  const { data: prod } = await db.from('productos').select('stock').eq('id', id).single();
  const stockReal = prod?.stock || 0;
  const enCarrito = carrito.filter(i => i.id == id).reduce((s,i) => s+i.cantidad, 0);
  if (enCarrito >= stockReal) { mostrarToast(`Solo hay ${stockReal} en stock`); return; }
  const key = `${id}_${tallaSeleccionada}`;
  const existing = carrito.find(i => i.key === key);
  if (existing) existing.cantidad++;
  else carrito.push({ key, id, nombre, precio, talla: tallaSeleccionada, imagen, cantidad: 1 });
  guardarCarrito();
  mostrarToast(`${nombre} (${tallaSeleccionada}) agregado al carrito`);
}



async function cargarProducto() {
  const id = new URLSearchParams(window.location.search).get('id');
  if (!id || id === 'undefined' || id === 'null') { window.location.href = 'coleccion.html'; return; }

  const { data: p, error } = await db.from('productos').select('*').eq('id', id).single();
  if (error || !p) {
    console.error('Error cargando producto:', error, 'id:', id);
    document.getElementById('detalle-contenido').innerHTML = `<div class="loading-wrap"><span class="loading-txt" style="cursor:pointer" onclick="window.location.href='coleccion.html'">Producto no encontrado — Volver al catálogo</span></div>`;
    return;
  }

  document.title = `HYT — ${p.nombre}`;
  const stock = p.stock || 0;
  const agotado = !p.disponible || stock === 0;
  const stockDot = stock === 0 ? 'out' : stock <= 3 ? 'low' : '';
  const stockTexto = stock === 0 ? 'Sin stock' : stock <= 3 ? `Últimas ${stock} unidades` : `${stock} disponibles`;
  const tallas = (p.tallas || 'S · M · L · XL').split(' · ');
  const tallasHTML = tallas.map(t => `<button class="talla-btn" onclick="seleccionarTalla(this,'${t}')">${t}</button>`).join('');

  document.getElementById('detalle-contenido').innerHTML = `
    <div class="detalle-wrap">
      <div class="detalle-img-wrap">
        <img class="detalle-img" src="${p.imagen_url}" alt="${p.nombre}">
      </div>
      <div class="detalle-info">
        <div class="detalle-categoria">HYT ESSENCE</div>
        <h1 class="detalle-nombre">${p.nombre}</h1>
        <div class="detalle-precio">$${Number(p.precio).toFixed(0)} MXN</div>
        <div class="detalle-stock">
          <span class="stock-dot ${stockDot}"></span>
          <span class="stock-txt">${stockTexto}</span>
        </div>
        <div class="detalle-divider"></div>
        ${p.descripcion ? `<p class="detalle-descripcion">${p.descripcion}</p>` : ''}
        <div class="talla-label">Selecciona tu talla</div>
        <div class="talla-grid">${tallasHTML}</div>
        ${!agotado ? `
          <button class="btn-agregar" onclick="agregarAlCarritoDetalle('${p.id}','${p.nombre}',${p.precio},'${p.imagen_url}')">
            Agregar al carrito
          </button>
         
        ` : `<button class="btn-agregar" disabled>Agotado</button>`}
      </div>
    </div>`;
}

cargarProducto();
</script>
</body>
</html>
