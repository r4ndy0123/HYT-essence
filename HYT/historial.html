<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HYT — Mis pedidos</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Tenor+Sans&display=swap" rel="stylesheet">
<link rel="stylesheet" href="menu.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --negro:#0a0a09;--fondo:#f4f2ed;--gris:#8f8f8f;
  --serif:'Cormorant Garamond',serif;--sans:'Tenor Sans',sans-serif;
  --verde:#2c7a3f;
}
body{background:linear-gradient(180deg,#f4f2ed 0%,#ece8e1 100%);min-height:100vh;font-family:var(--sans);color:var(--negro);padding:60px;}

.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:60px;}
.logo{font-family:var(--serif);font-size:28px;letter-spacing:.35em;}
.volver{text-decoration:none;padding:12px 24px;border:1px solid rgba(0,0,0,.15);border-radius:50px;color:var(--negro);font-size:10px;letter-spacing:.2em;text-transform:uppercase;transition:.3s;}
.volver:hover{background:var(--negro);color:white;}

.titulo{margin-bottom:40px;}
.titulo span{font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--gris);display:block;margin-bottom:10px;}
.titulo h1{font-family:var(--serif);font-size:56px;font-weight:300;}

.loading{text-align:center;padding:80px;font-size:12px;letter-spacing:.25em;text-transform:uppercase;color:var(--gris);}

.pedidos-lista{display:flex;flex-direction:column;gap:20px;}

.pedido-card{
  background:white;border-radius:20px;padding:28px;
  box-shadow:0 4px 24px rgba(0,0,0,.06);
}
.pedido-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;}
.pedido-fecha{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--gris);}
.pedido-total{font-family:var(--serif);font-size:22px;font-weight:300;white-space:nowrap;margin-left:12px;}

.pedido-items{display:flex;flex-direction:column;gap:10px;}
.pedido-item{
  display:flex;justify-content:space-between;align-items:center;
  padding:10px 0;border-bottom:1px solid rgba(0,0,0,.05);
}
.pedido-item:last-child{border-bottom:none;}
.pedido-item[style*="cursor:pointer"]:hover{background:#fafaf8;border-radius:10px;margin:0 -8px;padding:10px 8px;transition:background .2s;}
.pedido-item-img{width:56px;height:68px;object-fit:cover;border-radius:8px;flex-shrink:0;margin-right:14px;}
.pedido-item-img-placeholder{width:56px;height:68px;border-radius:8px;background:#f0ede8;flex-shrink:0;margin-right:14px;}
.pedido-item-nombre{font-family:var(--serif);font-size:18px;}
.pedido-item-detalle{font-size:11px;letter-spacing:.1em;color:var(--gris);margin-top:2px;}
.pedido-item-precio{font-size:14px;font-weight:600;}

.vacio{text-align:center;padding:80px 20px;}
.vacio p{font-family:var(--serif);font-size:28px;font-weight:300;color:var(--gris);margin-bottom:12px;}
.vacio span{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#bbb;}
.btn-ir{display:inline-block;margin-top:24px;padding:14px 32px;background:var(--negro);color:white;text-decoration:none;border-radius:50px;font-size:10px;letter-spacing:.2em;text-transform:uppercase;transition:.3s;}
.btn-ir:hover{opacity:.85;}

@media(max-width:768px){
  body{padding:20px;}
  .header{flex-direction:column;gap:14px;align-items:flex-start;}
  .titulo h1{font-size:38px;}
  .pedido-card{padding:20px;}
}
</style>
</head>
<body>

<div class="header">
  <div class="logo">HYT ESSENCE</div>
  <div style="display:flex;align-items:center;gap:12px;">
    <a href="index.html" class="volver">← Volver</a>
    <div class="hamburger dark" onclick="abrirMenu()"><span></span><span></span><span></span></div>
  </div>
</div>

<div class="titulo">
  <span>Mi cuenta</span>
  <h1>Mis pedidos</h1>
</div>

<div id="contenido"><div class="loading">Cargando pedidos...</div></div>

<script>
const SUPABASE_URL = 'https://ufzijqylddyaswijqtkp.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVmemlqcXlsZGR5YXN3aWpxdGtwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2NTg0ODEsImV4cCI6MjA5NTIzNDQ4MX0.lIogAVoQ6lrV6bHTuI3qqiqBSV8khXI6PLBTIGNlfk4';
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

async function cargarHistorial() {
  const contenido = document.getElementById('contenido');

  const { data: { session } } = await db.auth.getSession();
  if (!session) {
    window.location.href = 'login.html?redirect=historial.html';
    return;
  }

  const { data: pedidos, error } = await db
    .from('pedidos')
    .select('*')
    .eq('usuario_id', session.user.id)
    .order('created_at', { ascending: false });

  if (error || !pedidos || pedidos.length === 0) {
    contenido.innerHTML = `
      <div class="vacio">
        <p>Aún no tienes pedidos</p>
        <span>Explora nuestra colección</span>
        <a href="coleccion.html" class="btn-ir">Ver colección</a>
      </div>`;
    return;
  }

  const cards = pedidos.map(p => {
    const fecha = new Date(p.created_at).toLocaleDateString('es-MX', {
      day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit'
    });
    const itemsHTML = p.items.map(i => `
      <div class="pedido-item" onclick="window.location.href='detalle.html?id=${i.id || ''}'" style="${i.id ? 'cursor:pointer' : ''}">
        ${i.imagen ? `<img src="${i.imagen}" class="pedido-item-img" alt="${i.nombre}">` : '<div class="pedido-item-img-placeholder"></div>'}
        <div style="flex:1">
          <div class="pedido-item-nombre">${i.nombre}</div>
          <div class="pedido-item-detalle">Talla ${i.talla} · x${i.cantidad}</div>
        </div>
        <div class="pedido-item-precio">$${(i.precio * i.cantidad).toFixed(0)} MXN</div>
        ${i.id ? '<div style="font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:#bbb;margin-left:8px;">Ver →</div>' : ''}
      </div>`).join('');
    return `
      <div class="pedido-card">
        <div class="pedido-header">
          <span class="pedido-fecha">${fecha}</span>
          <span class="pedido-total">$${Number(p.total).toFixed(0)} MXN</span>
        </div>
        <div class="pedido-items">${itemsHTML}</div>
      </div>`;
  }).join('');

  contenido.innerHTML = `<div class="pedidos-lista">${cards}</div>`;
}

cargarHistorial();
</script>
<div id="hyt-menu-root"></div>
<script src="menu.js" defer></script>
</body>
</html>
