<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HYT — Mi carrito</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=Tenor+Sans&display=swap" rel="stylesheet">
<link rel="stylesheet" href="menu.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --negro:#0a0a09;--fondo:#f4f2ed;--gris:#8f8f8f;
  --serif:'Cormorant Garamond',serif;--sans:'Tenor Sans',sans-serif;
  --verde:#25D366;--rojo:#c0392b;--borde:rgba(0,0,0,.08);
}
html{scroll-behavior:smooth;}
body{background:var(--fondo);min-height:100vh;font-family:var(--sans);color:var(--negro);}

/* NAV */
.nav{
  position:fixed;top:0;left:0;right:0;z-index:200;
  display:flex;align-items:center;justify-content:space-between;
  padding:20px 52px;
  background:rgba(244,242,237,.95);backdrop-filter:blur(10px);
  border-bottom:1px solid rgba(0,0,0,.06);
}
.nav-logo{font-family:var(--serif);font-size:20px;letter-spacing:.35em;color:var(--negro);text-decoration:none;}
.nav-right{display:flex;align-items:center;gap:14px;}
.nav-back{
  text-decoration:none;padding:10px 20px;
  border:1px solid rgba(0,0,0,.15);border-radius:50px;
  color:var(--negro);font-size:10px;letter-spacing:.2em;text-transform:uppercase;transition:.3s;
}
.nav-back:hover{background:var(--negro);color:white;}

/* PAGE */
.page{max-width:1100px;margin:0 auto;padding:100px 52px 80px;}

.page-header{margin-bottom:48px;}
.page-header-eyebrow{font-size:10px;letter-spacing:.35em;text-transform:uppercase;color:var(--gris);margin-bottom:12px;}
.page-header-title{font-family:var(--serif);font-size:clamp(48px,5vw,72px);font-weight:300;line-height:1;}
.page-header-count{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--gris);margin-top:10px;}

/* LAYOUT */
.carrito-layout{display:grid;grid-template-columns:1fr 380px;gap:40px;align-items:start;}

/* ITEMS */
.items-wrap{}
.item-card{
  display:grid;grid-template-columns:100px 1fr auto;gap:20px;align-items:center;
  background:white;border-radius:20px;padding:20px;margin-bottom:14px;
  box-shadow:0 2px 16px rgba(0,0,0,.05);transition:box-shadow .25s;
}
.item-card:hover{box-shadow:0 6px 28px rgba(0,0,0,.1);}

.item-img{
  width:100px;height:124px;object-fit:cover;border-radius:14px;
  cursor:pointer;transition:opacity .2s;
}
.item-img:hover{opacity:.85;}
.item-img-ph{width:100px;height:124px;border-radius:14px;background:#ece8e1;}

.item-info{min-width:0;}
.item-nombre{
  font-family:var(--serif);font-size:22px;font-weight:400;
  cursor:pointer;transition:color .2s;margin-bottom:5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.item-nombre:hover{color:#555;}
.item-talla{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--gris);margin-bottom:14px;}
.item-qty{display:flex;align-items:center;gap:10px;}
.qty-btn{
  width:30px;height:30px;border-radius:50%;
  border:1px solid rgba(0,0,0,.15);background:white;
  font-size:16px;cursor:pointer;transition:.2s;
  display:flex;align-items:center;justify-content:center;
}
.qty-btn:hover{background:var(--negro);color:white;border-color:var(--negro);}
.qty-num{font-size:15px;min-width:24px;text-align:center;font-weight:500;}
.btn-quitar{
  background:none;border:none;
  font-size:10px;letter-spacing:.15em;text-transform:uppercase;
  color:#bbb;cursor:pointer;transition:.2s;margin-left:6px;padding:4px 0;
}
.btn-quitar:hover{color:var(--rojo);}

.item-precio{
  font-family:var(--serif);font-size:22px;font-weight:400;
  white-space:nowrap;text-align:right;
}
.item-unit{display:block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--gris);margin-top:3px;text-align:right;}

/* RESUMEN */
.resumen{
  background:white;border-radius:24px;padding:32px;
  box-shadow:0 4px 24px rgba(0,0,0,.07);
  position:sticky;top:90px;
}
.resumen-titulo{font-family:var(--serif);font-size:28px;font-weight:300;margin-bottom:28px;}
.resumen-linea{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-size:13px;}
.resumen-linea-label{color:var(--gris);letter-spacing:.1em;}
.resumen-linea-val{font-weight:500;}
.resumen-divider{height:1px;background:var(--borde);margin:20px 0;}
.resumen-total-label{font-size:10px;letter-spacing:.25em;text-transform:uppercase;color:var(--gris);}
.resumen-total-num{font-family:var(--serif);font-size:36px;font-weight:300;}
.resumen-total-row{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:28px;}

.btn-wa{
  width:100%;padding:17px;background:#25D366;color:white;
  border:none;border-radius:50px;font-family:var(--sans);
  font-size:12px;letter-spacing:.2em;text-transform:uppercase;
  cursor:pointer;transition:.3s;
  display:flex;align-items:center;justify-content:center;gap:10px;
  margin-bottom:10px;
}
.btn-wa:hover{background:#1fb855;transform:translateY(-2px);}
.btn-wa:disabled{opacity:.4;cursor:not-allowed;transform:none;}

.btn-seguir{
  width:100%;padding:14px;background:transparent;color:var(--negro);
  border:1px solid rgba(0,0,0,.15);border-radius:50px;
  font-family:var(--sans);font-size:11px;letter-spacing:.2em;text-transform:uppercase;
  cursor:pointer;transition:.3s;text-decoration:none;display:block;text-align:center;
}
.btn-seguir:hover{background:var(--negro);color:white;}

.btn-vaciar{
  width:100%;padding:12px;margin-top:8px;background:transparent;
  border:1px solid rgba(0,0,0,.08);border-radius:50px;
  font-family:var(--sans);font-size:10px;letter-spacing:.15em;text-transform:uppercase;
  color:#bbb;cursor:pointer;transition:.2s;
}
.btn-vaciar:hover{border-color:var(--rojo);color:var(--rojo);}

/* VACÍO */
.vacio{
  grid-column:1/-1;
  text-align:center;padding:100px 40px;
  background:white;border-radius:28px;
  box-shadow:0 4px 24px rgba(0,0,0,.06);
}
.vacio-icon{font-size:64px;margin-bottom:20px;opacity:.2;}
.vacio-titulo{font-family:var(--serif);font-size:42px;font-weight:300;margin-bottom:12px;}
.vacio-sub{font-size:11px;letter-spacing:.25em;text-transform:uppercase;color:var(--gris);margin-bottom:32px;}
.btn-ir-coleccion{
  display:inline-block;padding:16px 40px;background:var(--negro);color:white;
  text-decoration:none;border-radius:50px;font-family:var(--sans);
  font-size:11px;letter-spacing:.2em;text-transform:uppercase;transition:.3s;
}
.btn-ir-coleccion:hover{opacity:.85;transform:translateY(-2px);}

/* TOAST */
.toast{
  position:fixed;bottom:30px;left:50%;
  transform:translateX(-50%) translateY(20px);
  background:var(--negro);color:white;padding:14px 28px;
  border-radius:50px;font-size:12px;letter-spacing:.15em;
  text-transform:uppercase;opacity:0;transition:.3s;z-index:600;white-space:nowrap;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* MODAL VACIAR CARRITO */
.modal-overlay {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.3); backdrop-filter: blur(5px);
  display: flex; align-items: center; justify-content: center;
  z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
}
.modal-overlay.show { opacity: 1; pointer-events: auto; }

.modal-box {
  background: white; border-radius: 24px; padding: 40px;
  max-width: 380px; width: 90%; text-align: center;
  box-shadow: 0 10px 40px rgba(0,0,0,0.1);
  transform: translateY(20px); transition: transform 0.3s ease;
}
.modal-overlay.show .modal-box { transform: translateY(0); }

.modal-titulo { font-family: var(--serif); font-size: 32px; font-weight: 300; margin-bottom: 12px; }
.modal-texto { font-size: 13px; color: var(--gris); margin-bottom: 30px; line-height: 1.5; }

.modal-acciones { display: flex; gap: 12px; justify-content: center; }
.btn-modal-cancel {
  padding: 12px 24px; border: 1px solid rgba(0,0,0,0.15); border-radius: 50px;
  background: transparent; color: var(--negro); font-family: var(--sans);
  font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; cursor: pointer; transition: 0.2s;
}
.btn-modal-cancel:hover { background: var(--fondo); }

.btn-modal-confirm {
  padding: 12px 24px; border: none; border-radius: 50px;
  background: var(--rojo); color: white; font-family: var(--sans);
  font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; cursor: pointer; transition: 0.2s;
}
.btn-modal-confirm:hover { opacity: 0.85; }

/* RESPONSIVE */
@media(max-width:900px){
  .nav{padding:16px 20px;}
  .page{padding:80px 20px 60px;}
  .carrito-layout{grid-template-columns:1fr;}
  .resumen{position:static;}
  .item-card{grid-template-columns:80px 1fr auto;gap:14px;padding:16px;}
  .item-img,.item-img-ph{width:80px;height:100px;}
  .item-nombre{font-size:18px;}
  .item-precio{font-size:18px;}
  .page-header-title{font-size:42px;}
}
@media(max-width:480px){
  .item-card{grid-template-columns:70px 1fr;gap:12px;}
  .item-precio{display:none;}
  .item-talla{margin-bottom:10px;}
}
</style>
</head>
<body>

<nav class="nav">
  <a href="index.html" class="nav-logo">HYT ESSENCE</a>
  <div class="nav-right">
    <a href="coleccion.html" class="nav-back">← Colección</a>
    <div class="hamburger dark" onclick="abrirMenu()"><span></span><span></span><span></span></div>
  </div>
</nav>

<div class="page">
  <div class="page-header">
    <div class="page-header-eyebrow">HYT ESSENCE</div>
    <h1 class="page-header-title">Mi carrito</h1>
    <div class="page-header-count" id="header-count"></div>
  </div>
  <div class="carrito-layout" id="carrito-layout">
    <!-- renderizado por JS -->
  </div>
</div>

<div id="modal-vaciar" class="modal-overlay">
  <div class="modal-box">
    <h2 class="modal-titulo">¿Vaciar carrito?</h2>
    <p class="modal-texto">Se eliminarán todos los productos de tu carrito. Esta acción no se puede deshacer.</p>
    <div class="modal-acciones">
      <button class="btn-modal-cancel" onclick="cerrarModalVaciar()">Cancelar</button>
      <button class="btn-modal-confirm" onclick="confirmarVaciar()">Vaciar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div id="hyt-menu-root"></div>
<script src="menu.js" defer></script>

<script>
const SUPABASE_URL = 'https://ufzijqylddyaswijqtkp.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVmemlqcXlsZGR5YXN3aWpxdGtwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2NTg0ODEsImV4cCI6MjA5NTIzNDQ4MX0.lIogAVoQ6lrV6bHTuI3qqiqBSV8khXI6PLBTIGNlfk4';
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);
const WA = '5217821317909';

let carrito = JSON.parse(localStorage.getItem('hyt_carrito') || '[]');

function guardar() {
  localStorage.setItem('hyt_carrito', JSON.stringify(carrito));
  if (typeof menuActualizarBadge === 'function') menuActualizarBadge();
}

function mostrarToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

async function cambiarCantidad(key, delta) {
  const item = carrito.find(i => i.key === key);
  if (!item) return;
  if (delta > 0) {
    const { data: prod } = await db.from('productos').select('stock').eq('id', item.id).single();
    const stockReal = prod?.stock || 0;
    const totalEnCarrito = carrito.filter(i => i.id == item.id).reduce((s,i) => s + i.cantidad, 0);
    if (totalEnCarrito >= stockReal) { mostrarToast(`Solo hay ${stockReal} en stock`); return; }
  }
  item.cantidad += delta;
  if (item.cantidad <= 0) carrito = carrito.filter(i => i.key !== key);
  guardar();
  render();
}

function eliminarItem(key) {
  carrito = carrito.filter(i => i.key !== key);
  guardar();
  render();
}

function vaciarCarrito() {
  // En lugar del 'confirm', abrimos nuestro modal elegante
  document.getElementById('modal-vaciar').classList.add('show');
}

function cerrarModalVaciar() {
  // Cierra el modal si el usuario se arrepiente
  document.getElementById('modal-vaciar').classList.remove('show');
}

function confirmarVaciar() {
  // Ejecuta el vaciado, cierra el modal y avisa al usuario
  carrito = [];
  guardar();
  render();
  cerrarModalVaciar();
  mostrarToast('Carrito vaciado');
}

async function pedirWhatsApp() {
  const btn = document.getElementById('btn-wa');
  btn.disabled = true;
  btn.textContent = 'Verificando...';

  const { data: { session } } = await db.auth.getSession();
  if (!session) {
    guardar();
    mostrarToast('Inicia sesión para continuar');
    setTimeout(() => window.location.href = 'login.html?redirect=carrito.html', 1200);
    return;
  }

  const nombre = session.user.user_metadata?.nombre || session.user.email.split('@')[0];
  const total = carrito.reduce((s, i) => s + i.precio * i.cantidad, 0);
  const lineas = carrito.map(i =>
    `• ${i.nombre} (Talla ${i.talla}) x${i.cantidad} — $${(i.precio * i.cantidad).toFixed(0)} MXN`
  ).join('\n');
  const mensaje = `Hola, soy *${nombre}* y me interesan los siguientes productos de HYT ESSENCE:\n\n${lineas}\n\n*Total: $${total.toFixed(0)} MXN*\n\n¿Me pueden ayudar con el pedido?`;
  window.open(`https://wa.me/${WA}?text=${encodeURIComponent(mensaje)}`, '_blank');

  await db.from('pedidos').insert({
    usuario_id: session.user.id,
    items: carrito.map(i => ({ id: i.id, nombre: i.nombre, talla: i.talla, cantidad: i.cantidad, precio: i.precio, imagen: i.imagen })),
    total
  });

  carrito = [];
  guardar();
  render();
}

function render() {
  const layout = document.getElementById('carrito-layout');
  const countEl = document.getElementById('header-count');
  const totalItems = carrito.reduce((s, i) => s + i.cantidad, 0);

  if (carrito.length === 0) {
    countEl.textContent = '';
    layout.innerHTML = `
      <div class="vacio">
        <div class="vacio-icon">🛍</div>
        <div class="vacio-titulo">Tu carrito está vacío</div>
        <div class="vacio-sub">Explora la colección y agrega algo que te guste</div>
        <a href="coleccion.html" class="btn-ir-coleccion">Ver colección</a>
      </div>`;
    return;
  }

  countEl.textContent = `${totalItems} ${totalItems === 1 ? 'producto' : 'productos'}`;
  const total = carrito.reduce((s, i) => s + i.precio * i.cantidad, 0);
  const totalPiezas = totalItems;

  const itemsHTML = carrito.map(item => `
    <div class="item-card">
      ${item.imagen
        ? `<img class="item-img" src="${item.imagen}" alt="${item.nombre}"
            onclick="window.location.href='detalle.html?id=${item.id}'">`
        : `<div class="item-img-ph"></div>`}
      <div class="item-info">
        <div class="item-nombre" onclick="window.location.href='detalle.html?id=${item.id}'">${item.nombre}</div>
        <div class="item-talla">Talla: ${item.talla}</div>
        <div class="item-qty">
          <button class="qty-btn" onclick="cambiarCantidad('${item.key}', -1)">−</button>
          <span class="qty-num">${item.cantidad}</span>
          <button class="qty-btn" onclick="cambiarCantidad('${item.key}', 1)">+</button>
          <button class="btn-quitar" onclick="eliminarItem('${item.key}')">Quitar</button>
        </div>
      </div>
      <div>
        <div class="item-precio">$${(item.precio * item.cantidad).toFixed(0)}</div>
        <span class="item-unit">MXN${item.cantidad > 1 ? ` · $${Number(item.precio).toFixed(0)} c/u` : ''}</span>
      </div>
    </div>`).join('');

  const resumenLineas = carrito.map(i => `
    <div class="resumen-linea">
      <span class="resumen-linea-label">${i.nombre} ×${i.cantidad}</span>
      <span class="resumen-linea-val">$${(i.precio * i.cantidad).toFixed(0)}</span>
    </div>`).join('');

  layout.innerHTML = `
    <div class="items-wrap">${itemsHTML}</div>
    <div class="resumen">
      <div class="resumen-titulo">Resumen</div>
      ${resumenLineas}
      <div class="resumen-divider"></div>
      <div class="resumen-total-row">
        <span class="resumen-total-label">Total</span>
        <span class="resumen-total-num">$${total.toFixed(0)} <span style="font-size:14px;letter-spacing:.1em;">MXN</span></span>
      </div>
      <button class="btn-wa" id="btn-wa" onclick="pedirWhatsApp()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
        Pedir por WhatsApp
      </button>
      <a href="coleccion.html" class="btn-seguir">← Seguir comprando</a>
      <button class="btn-vaciar" onclick="vaciarCarrito()">Vaciar carrito</button>
    </div>`;
}

render();
</script>
</body>
</html>
